{% extends "base.html" %}

{% block extra_css %}
<style>
    .links-wrap { max-width: 900px; margin: 0 auto; }
    .links-toolbar {
        position: sticky; top: 0; z-index: 5;
        background: #212529; padding: .5rem 0 1rem;
    }
    .links-scroll {
        max-height: calc(100vh - 210px);
        overflow-y: auto;
        padding-right: .25rem;
    }
    /* Subtle scrollbar to match the dark theme */
    .links-scroll::-webkit-scrollbar { width: 10px; }
    .links-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 6px; }
    .links-scroll::-webkit-scrollbar-track { background: transparent; }

    .link-card {
        display: flex; gap: 1rem;
        background: #2a2f34; border: 1px solid #3a4046; border-radius: 0;
        padding: .6rem; margin-bottom: .75rem;
        transition: background .15s ease, transform .05s ease;
    }
    .link-card:hover { background: #323841; }
    .link-thumb {
        position: relative; flex: 0 0 168px; height: 94px;
        border-radius: 8px; overflow: hidden; background: #000;
        display: flex; align-items: center; justify-content: center;
    }
    .link-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .link-thumb .thumb-fallback { font-size: 2rem; color: #6c757d; }
    .link-thumb .thumb-badge {
        position: absolute; bottom: 4px; right: 4px;
        background: rgba(0,0,0,.8); color: #fff; font-size: .7rem;
        padding: 1px 5px; border-radius: 3px;
    }
    .link-body { flex: 1 1 auto; min-width: 0; }
    .link-title {
        font-weight: 600; color: #fff; margin: 0 0 .2rem;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .link-url {
        color: #8ab4f8; font-size: .8rem;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        display: block; text-decoration: none;
    }
    .link-url:hover { text-decoration: underline; }
    .link-meta { margin-top: .35rem; display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
    .pill { font-size: .7rem; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; }
    .pill-audio { background:#0d3b66; color:#cfe3ff; }
    .pill-video { background:#3b0d3b; color:#f3cff3; }
    .pill-playlist { background:#3b360d; color:#f3eccf; }
    .pill-single { background:#22282d; color:#adb5bd; border-color:#3a4046; }
    .pill-status { background:#22282d; color:#adb5bd; border-color:#3a4046; }
    .pill-status.completed { background:#0f3d24; color:#b6f0cf; }
    .pill-status.error, .pill-status.completed_with_errors { background:#4a1414; color:#ffc9c9; }
    .pill-status.started { background:#123a4a; color:#bfe9ff; }
    .link-time { color:#8b949e; font-size:.72rem; margin-left:auto; white-space:nowrap; }
    .link-actions { display:flex; gap:.4rem; margin-top:.5rem; }
    .link-actions .btn { font-size:.75rem; padding:.15rem .5rem; }
    .links-empty { text-align:center; color:#8b949e; padding:4rem 1rem; }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5 links-wrap">
    <h1 class="display-6 fw-bold mb-4 text-center">Links History</h1>

    <div class="links-toolbar">
        <div class="d-flex align-items-center gap-2">
            <input type="text" id="link-search"
                   class="form-control bg-dark text-light border-secondary"
                   placeholder="Search links or titles…">
            <button class="btn btn-outline-secondary" id="refresh-links" title="Refresh">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button class="btn btn-outline-danger" id="clear-links" title="Clear all history">
                <i class="bi bi-trash"></i>
            </button>
        </div>
        <div class="text-muted small mt-2" id="links-count">Loading…</div>
    </div>

    <div class="links-scroll" id="links-list">
        <!-- Cards injected here -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    (function () {
        let allLinks = [];

        function getVideoId(url) {
            try {
                const u = new URL(url);
                if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
                if (u.searchParams.get('v')) return u.searchParams.get('v');
            } catch (e) { /* not a valid URL */ }
            return null;
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function fmtTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return esc(iso);
            return d.toLocaleString();
        }

        function cardHtml(item) {
            const vid = getVideoId(item.url);
            const thumb = vid
                ? `<img src="https://i.ytimg.com/vi/${esc(vid)}/mqdefault.jpg" alt=""
                        onerror="this.style.display='none';this.parentNode.querySelector('.thumb-fallback').style.display='block';">
                   <span class="thumb-fallback" style="display:none;"><i class="bi bi-music-note-beamed"></i></span>`
                : `<span class="thumb-fallback"><i class="bi bi-collection-play"></i></span>`;

            const typePill = item.download_type === 'video'
                ? '<span class="pill pill-video">Video</span>'
                : '<span class="pill pill-audio">Audio</span>';
            const modePill = item.playlist_mode === 'playlist'
                ? '<span class="pill pill-playlist">Playlist</span>'
                : '<span class="pill pill-single">Single</span>';
            const status = esc(item.status || '');
            const statusPill = status
                ? `<span class="pill pill-status ${status}">${status.replace(/_/g, ' ')}</span>`
                : '';

            return `
                <div class="link-card">
                    <div class="link-thumb">${thumb}
                        <span class="thumb-badge">${item.download_type === 'video' ? 'MP4' : 'MP3'}</span>
                    </div>
                    <div class="link-body">
                        <p class="link-title">${esc(item.title || item.url)}</p>
                        <a class="link-url" href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.url)}</a>
                        <div class="link-meta">
                            ${typePill}${modePill}${statusPill}
                            <span class="link-time">${fmtTime(item.timestamp)}</span>
                        </div>
                        <div class="link-actions">
                            <a class="btn btn-outline-light" href="${esc(item.url)}" target="_blank" rel="noopener">
                                <i class="bi bi-box-arrow-up-right"></i> Open
                            </a>
                            <button class="btn btn-outline-light copy-btn" data-url="${esc(item.url)}">
                                <i class="bi bi-clipboard"></i> Copy
                            </button>
                            <a class="btn btn-outline-primary" href="/?url=${encodeURIComponent(item.url)}">
                                <i class="bi bi-arrow-repeat"></i> Re-use
                            </a>
                        </div>
                    </div>
                </div>`;
        }

        function render(list) {
            const el = document.getElementById('links-list');
            const count = document.getElementById('links-count');
            if (!list.length) {
                el.innerHTML = '<div class="links-empty"><i class="bi bi-link-45deg" style="font-size:2.5rem;"></i>'
                    + '<p class="mt-2">No links yet. Downloads you start will appear here.</p></div>';
                count.textContent = '0 links';
                return;
            }
            el.innerHTML = list.map(cardHtml).join('');
            count.textContent = list.length + (list.length === 1 ? ' link' : ' links');
        }

        function applyFilter() {
            const q = document.getElementById('link-search').value.trim().toLowerCase();
            if (!q) { render(allLinks); return; }
            render(allLinks.filter(i =>
                (i.title || '').toLowerCase().includes(q) ||
                (i.url || '').toLowerCase().includes(q)));
        }

        function load() {
            document.getElementById('links-count').textContent = 'Loading…';
            fetch('/api/links-history')
                .then(r => r.json())
                .then(data => { allLinks = Array.isArray(data) ? data : []; applyFilter(); })
                .catch(() => { document.getElementById('links-count').textContent = 'Failed to load links.'; });
        }

        document.addEventListener('DOMContentLoaded', function () {
            load();
            document.getElementById('refresh-links').addEventListener('click', load);
            document.getElementById('link-search').addEventListener('input', applyFilter);

            document.getElementById('clear-links').addEventListener('click', function () {
                if (!confirm('Clear the entire links history? This cannot be undone.')) return;
                fetch('/api/clear-links-history', { method: 'POST' })
                    .then(r => r.json()).then(load);
            });

            // Copy-to-clipboard (event delegation)
            document.getElementById('links-list').addEventListener('click', function (e) {
                const btn = e.target.closest('.copy-btn');
                if (!btn) return;
                const url = btn.getAttribute('data-url');
                const done = () => {
                    const orig = btn.innerHTML;
                    btn.innerHTML = '<i class="bi bi-check2"></i> Copied';
                    setTimeout(() => { btn.innerHTML = orig; }, 1200);
                };
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(done).catch(done);
                } else {
                    const t = document.createElement('textarea');
                    t.value = url; document.body.appendChild(t); t.select();
                    try { document.execCommand('copy'); } catch (err) {}
                    document.body.removeChild(t); done();
                }
            });
        });
    })();
</script>
{% endblock %}
